# Security checks for this repository (workspace-wide convention).
# Install once:  python -m pip install pre-commit && python -m pre_commit install
# Manual run:    python -m pre_commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(\.secrets\.baseline|package-lock\.json|Cargo\.lock)$|(^|/)vendor/'

  # Virus scan staged binary artifacts before commit (see SECURITY.md).
  # Uses ClamAV if on PATH, otherwise Windows Defender (MpCmdRun.exe).
  # Blocks the commit when no scanner is available. Manual full scan:
  #   python tools/scan_binaries.py --all
  - repo: local
    hooks:
      - id: virus-scan-binaries
        name: Virus scan binary artifacts
        entry: python tools/scan_binaries.py
        language: system
        pass_filenames: true
        files: '(?i)\.(zip|exe|dll|msi|7z|rar|com|scr|jar|cab|iso)$'
